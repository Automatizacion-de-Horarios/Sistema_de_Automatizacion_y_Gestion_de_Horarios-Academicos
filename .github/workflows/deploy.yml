name: Deploy a VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Desplegar en VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST_VPS }}
          username: senati
          key: ${{ secrets.KEY_PRIVADA_VPS }}
          script: |
            set -e

            APP_DIR="/home/senati/apps/sistema-horarios"
            REPO="https://github.com"

            echo "=========================================="
            echo "1. ACTUALIZANDO CÓDIGO (SIN BORRAR NADA)"
            echo "=========================================="

            mkdir -p "$APP_DIR"

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "$REPO" "$APP_DIR"
            else
              cd "$APP_DIR"
              git fetch origin
              git reset --hard origin/main
              # 💡 Se eliminó 'git clean -fd' para proteger tus archivos .env locales
            fi

            cd "$APP_DIR"

            echo "Commit desplegado:"
            git log -1 --oneline

            echo "=========================================="
            echo "2. INSTALANDO DEPENDENCIAS DEL BACKEND"
            echo "=========================================="

            # Instalación limpia de las dependencias base
            npm ci --omit=dev

            # Asegurar la instalación explícita de los módulos requeridos
            echo "Instalando módulos críticos de autenticación..."
            npm install bcryptjs jsonwebtoken --omit=dev

            echo "=========================================="
            echo "2.1 INSTALANDO DEPENDENCIAS PYTHON DEL SOLVER"
            echo "=========================================="

            if ! command -v python3 >/dev/null 2>&1; then
              echo "ERROR: python3 no está instalado en el VPS."
              echo "Instala python3, python3-venv y python3-pip antes de desplegar."
              exit 1
            fi

            if [ ! -x "$APP_DIR/.venv/bin/python" ]; then
              echo "Creando entorno virtual .venv..."
              if ! python3 -m venv "$APP_DIR/.venv"; then
                echo "ERROR: no se pudo crear .venv."
                echo "Instala el paquete python3-venv en el VPS."
                exit 1
              fi
            fi

            "$APP_DIR/.venv/bin/python" -m pip install --upgrade pip
            "$APP_DIR/.venv/bin/python" -m pip install -r "$APP_DIR/requirements-solver.txt"
            "$APP_DIR/.venv/bin/python" -c "import ortools, pymysql, openpyxl; print('Dependencias Python del solver OK')"

            echo "=========================================="
            echo "3. INSTALANDO DEPENDENCIAS DEL FRONTEND"
            echo "=========================================="

            cd "$APP_DIR/frontend"

            npm install

            echo "=========================================="
            echo "4. COMPILANDO REACT"
            echo "=========================================="

            npm run build

            echo "=========================================="
            echo "4.1 MIGRANDO BORRADORES"
            echo "=========================================="

            cd "$APP_DIR"
            node scripts/migrar-borradores.js
            node scripts/migrar-auditoria.js

            echo "=========================================="
            echo "5. REINICIANDO BACKEND"
            echo "=========================================="

            cd "$APP_DIR"

            pm2 restart horarios-backend

            echo "=========================================="
            echo "6. GUARDANDO ESTADO DE PM2"
            echo "=========================================="

            pm2 save

            echo "=========================================="
            echo "7. VERIFICACIÓN FINAL"
            echo "=========================================="

            echo ""
            echo "Commit:"
            git log -1 --oneline

            echo ""
            echo "Frontend compilado:"
            ls -lah "$APP_DIR/frontend/dist"

            echo ""
            echo "Estado PM2:"
            pm2 status

            echo ""
            echo "=========================================="
            echo "DEPLOY COMPLETADO CORRECTAMENTE"
            echo "=========================================="
